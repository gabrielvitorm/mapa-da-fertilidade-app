name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/mapa_fertilidade
      SESSION_SECRET: ci-session-secret
      DEMO_MODE: 'true'
      APP_BASE_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npx prisma validate
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
      - name: Domain tests
        shell: bash
        run: for f in src/lib/*.test.ts; do npx tsx "$f" || exit 1; done
